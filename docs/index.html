<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확률과 통계 강의자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#1F3A5F;--accent:#E4572E;--paper:#FBFBF8;--ink:#14213D;--gray:#6B7A90;--line:#D5DCE6}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}
main{max-width:880px;margin:0 auto;padding:64px 16px}
h1{font-size:40px;margin:0 0 6px;color:var(--navy)}
p{color:var(--gray);margin:0 0 32px}
a.card{display:flex;gap:20px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:inherit;margin-bottom:14px}
a.card:hover{border-color:var(--accent)}
a.card img{width:160px;height:100px;object-fit:cover;border-radius:10px}
.wk{color:var(--accent);font-weight:800;font-size:14px}
.tt{font-size:24px;font-weight:800}
@media (max-width:520px){a.card{flex-direction:column;align-items:flex-start}a.card img{width:100%;height:160px}}
</style>
</head>
<body>
<main>
  <h1>확률과 통계</h1>
  <p>대학교 1학년 공과대학 · 인터랙티브 웹 슬라이드</p>
  <a class="card" href="week01/">
    <img src="week01/media/carousel.jpg" alt="회전목마">
    <div><div class="wk">1주차</div><div class="tt">여러 가지 순열</div><div style="color:var(--gray)">원순열과 중복순열 · 실험실 6종</div></div>
  </a>
</main>
</body>
</html>
